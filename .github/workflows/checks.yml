name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.3.1
      - name: Locked install and checks
        env:
          KEEP_TOKEN: ${{ secrets.APPCHI_REPOSITORIES_TOKEN }}
        run: |
          poetry check --lock
          poetry sync --all-extras
          poetry run ruff check src tests
          if [ -d tests/unit ]; then poetry run pytest tests/unit -q; fi
          poetry build --format wheel
